<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Confirmado — Ginops TCG</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red:#CC0000; --yellow:#FFCB05; --blue:#3B4CCA; --dark:#0f0f1e; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Nunito',sans-serif;
            background:var(--dark); min-height:100vh; color:#fff;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:40px 20px; text-align:center; overflow:hidden;
        }
        body::before {
            content:''; position:fixed; inset:0;
            background:radial-gradient(ellipse at 50% 40%, rgba(59,76,202,.25) 0%, transparent 65%);
            z-index:0;
        }
        .content { position:relative; z-index:1; max-width:520px; }

        /* Confetti animado */
        .confetti { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .confetti span {
            position:absolute; top:-10px; border-radius:2px;
            animation:fall linear infinite;
        }
        @keyframes fall {
            to { transform:translateY(105vh) rotate(720deg); opacity:0; }
        }

        .icon { font-size:80px; animation:pop .7s cubic-bezier(.34,1.56,.64,1); margin-bottom:20px; display:block; }
        @keyframes pop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }

        h1 {
            font-family:'Cinzel',serif; font-size:clamp(22px,5vw,36px); font-weight:900;
            background:linear-gradient(135deg,#fff,var(--yellow));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; margin-bottom:10px;
            animation:up .5s ease .2s both;
        }
        @keyframes up { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

        .badge {
            display:inline-block;
            background:linear-gradient(135deg,rgba(255,203,5,.15),rgba(255,203,5,.05));
            border:1.5px solid rgba(255,203,5,.3); border-radius:30px;
            padding:6px 18px; margin-bottom:20px;
            font-family:'Press Start 2P',monospace; font-size:7px; color:var(--yellow);
            animation:up .5s ease .1s both;
        }

        p {
            color:rgba(255,255,255,.65); font-size:15px; line-height:1.75;
            margin-bottom:28px; animation:up .5s ease .3s both;
        }

        .pedido-id {
            background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
            border-radius:12px; padding:14px 20px; margin-bottom:28px;
            font-size:12px; color:rgba(255,255,255,.5);
            animation:up .5s ease .35s both;
        }
        .pedido-id span { color:var(--yellow); font-weight:800; font-size:13px; }

        .btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; animation:up .5s ease .4s both; }

        .btn-primary {
            background:linear-gradient(135deg,var(--yellow),#f0a800);
            color:#1a1a2e; border:none; padding:14px 28px;
            border-radius:13px; font-family:'Press Start 2P',monospace;
            font-size:9px; cursor:pointer; text-decoration:none;
            transition:all .3s; box-shadow:0 6px 24px rgba(255,203,5,.3);
        }
        .btn-primary:hover { transform:translateY(-3px); box-shadow:0 10px 32px rgba(255,203,5,.45); }

        .btn-sec {
            background:rgba(255,255,255,.08); color:rgba(255,255,255,.7);
            border:1.5px solid rgba(255,255,255,.14); padding:14px 24px;
            border-radius:13px; font-family:'Nunito',sans-serif;
            font-weight:800; font-size:14px; cursor:pointer; text-decoration:none;
            transition:all .25s;
        }
        .btn-sec:hover { background:rgba(255,255,255,.14); }
    </style>
</head>
<body>

<!-- Confetti -->
<div class="confetti" id="confetti"></div>

<div class="content">
    <span class="icon">🎉</span>
    <div class="badge">PAGAMENTO APROVADO</div>
    <h1>Envio Solicitado!</h1>
    <p>
        Seu pagamento foi confirmado com sucesso!<br>
        Vamos preparar sua encomenda e você receberá<br>
        o <strong style="color:var(--yellow)">código de rastreio</strong> em breve.
    </p>

    <div class="pedido-id" id="pedidoBox" style="display:none">
        Pedido: <span id="pedidoId">—</span>
    </div>

    <div class="btns">
        <a href="dashboard.html" class="btn-primary">← VOLTAR AO DASHBOARD</a>
    </div>
</div>

<script>
    // Pega pedido da URL
    var params = new URLSearchParams(window.location.search);
    var pedido = params.get('pedido');
    if (pedido) {
        document.getElementById('pedidoBox').style.display = 'block';
        document.getElementById('pedidoId').textContent = pedido;
    }

    // Gera confetti
    var container = document.getElementById('confetti');
    var colors = ['#FFCB05','#3B4CCA','#CC0000','#fff','#00C853'];
    for (var i = 0; i < 60; i++) {
        var el = document.createElement('span');
        var size = Math.random() * 10 + 6;
        el.style.cssText = [
            'left:'   + Math.random()*100 + '%',
            'width:'  + size + 'px',
            'height:' + (size * (Math.random()*1.5+.5)) + 'px',
            'background:' + colors[Math.floor(Math.random()*colors.length)],
            'animation-duration:' + (Math.random()*3+2.5) + 's',
            'animation-delay:'    + (Math.random()*3) + 's',
            'opacity:' + (Math.random()*.6+.4),
            'transform:rotate(' + Math.random()*360 + 'deg)'
        ].join(';');
        container.appendChild(el);
    }
</script>
</body>
</html>
